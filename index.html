<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="GymTracker" />
  <meta name="theme-color" content="#1c1c1c" />
  <title>GymTracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #333;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── HEADER ── */
    header {
      background: #1c1c1c;
      color: #fff;
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header .logo {
      background: #d0021b;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: bold; letter-spacing: 1px; }

    /* ── NAVIGAZIONE A SCHEDE ── */
    .tabs {
      display: flex;
      background: #1c1c1c;
      border-top: 1px solid #333;
    }
    .tabs button {
      flex: 1;
      background: none;
      border: none;
      color: #888;
      padding: 11px 0;
      font-size: 13px;
      font-family: Arial, sans-serif;
      cursor: pointer;
      letter-spacing: .5px;
      border-bottom: 3px solid transparent;
    }
    .tabs button.active {
      color: #fff;
      border-bottom: 3px solid #d0021b;
    }

    /* ── CONTAINER ── */
    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    /* ── CARD ── */
    .card {
      background: #fff;
      border: 1px solid #ccc;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    /* ── FORM AGGIUNGI ESERCIZIO ── */
    .add-form-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .add-form-grid .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .add-form-grid input[type="text"] {
      flex: 1;
      border: 1px solid #ccc;
      padding: 12px 10px;
      font-size: 16px;
      outline: none;
    }
    .add-form-grid input[type="text"]:focus { border-color: #d0021b; }

    /* pulsante upload immagine */
    .img-upload-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px dashed #ccc;
      padding: 10px 12px;
      cursor: pointer;
      background: #f9f9f9;
      font-size: 14px;
      color: #555;
    }
    .img-upload-btn:active { border-color: #d0021b; }
    .img-upload-btn .preview {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border: 1px solid #ddd;
      display: none;
      flex-shrink: 0;
    }
    .img-upload-btn .preview.visible { display: block; }
    .img-upload-btn span { font-size: 13px; }
    #file-input { display: none; }

    .btn-add {
      background: #d0021b;
      color: #fff;
      border: none;
      padding: 13px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
      font-family: Arial, sans-serif;
      letter-spacing: .5px;
    }
    .btn-add:active { background: #a80016; }

    /* ── LISTA ESERCIZI ── */
    #exercise-list { list-style: none; }
    #exercise-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #eee;
      margin-bottom: 6px;
      background: #fff;
      cursor: pointer;
      min-height: 60px;
    }
    #exercise-list li:nth-child(even) { background: #f9f9f9; }
    #exercise-list li:active { background: #1c1c1c; color: #fff; }

    /* icona esercizio in lista */
    .ex-icon {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border: 1px solid #ddd;
      flex-shrink: 0;
    }
    .ex-icon-placeholder {
      width: 44px;
      height: 44px;
      background: #eee;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      color: #aaa;
    }

    #exercise-list li .ex-name { font-size: 15px; flex: 1; }
    .ex-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .ex-actions button {
      background: none;
      border: 1px solid #ccc;
      color: #888;
      cursor: pointer;
      font-size: 12px;
      padding: 5px 9px;
      min-height: 34px;
      font-family: Arial, sans-serif;
    }
    .ex-actions .btn-del:active { background: #d0021b; color: #fff; border-color: #d0021b; }
    .ex-actions .btn-edit:active { background: #1c1c1c; color: #fff; border-color: #1c1c1c; }

    /* ── MODAL MODIFICA ICONA ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }
    .modal h3 {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #1c1c1c;
    }
    .modal-img-preview {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border: 1px solid #ddd;
      display: block;
      margin: 0 auto 14px;
    }
    .modal-img-placeholder {
      width: 80px;
      height: 80px;
      background: #f2f2f2;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 14px;
      color: #aaa;
    }
    .modal-upload-btn {
      display: block;
      width: 100%;
      border: 1px dashed #ccc;
      padding: 11px;
      text-align: center;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      background: #f9f9f9;
      margin-bottom: 14px;
      font-family: Arial, sans-serif;
    }
    .modal-upload-btn:active { border-color: #d0021b; }
    #modal-file-input { display: none; }
    .modal-remove-btn {
      display: block;
      width: 100%;
      border: 1px solid #d0021b;
      color: #d0021b;
      background: none;
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 14px;
      font-family: Arial, sans-serif;
    }
    .modal-remove-btn:active { background: #d0021b; color: #fff; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      border: none;
    }
    .modal-btn-cancel { background: #eee; color: #333; }
    .modal-btn-save   { background: #d0021b; color: #fff; font-weight: bold; }
    .modal-btn-cancel:active { background: #ccc; }
    .modal-btn-save:active   { background: #a80016; }

    /* ── PAGINA LOG ── */
    #log-exercise-name {
      font-size: 20px;
      font-weight: bold;
      color: #1c1c1c;
      margin-bottom: 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #log-exercise-name img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border: 1px solid #ddd;
    }
    #log-exercise-name span { color: #d0021b; }

    .log-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .log-inputs label {
      font-size: 12px;
      color: #888;
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .log-inputs input {
      width: 100%;
      border: 1px solid #ccc;
      padding: 14px 10px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .log-inputs input:focus { border-color: #d0021b; border-width: 2px; }

    .quick-reps {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .quick-reps button {
      flex: 1;
      min-width: 48px;
      background: #fff;
      border: 1px solid #ccc;
      padding: 10px 0;
      font-size: 15px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }
    .quick-reps button:active { background: #1c1c1c; color: #fff; border-color: #1c1c1c; }

    .btn-primary {
      width: 100%;
      background: #d0021b;
      color: #fff;
      border: none;
      padding: 16px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      font-family: Arial, sans-serif;
      letter-spacing: .5px;
    }
    .btn-primary:active { background: #a80016; }

    /* ── GRIGLIA SELEZIONE ESERCIZIO (tab Log) ── */
    #log-exercise-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .log-ex-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 6px;
      border: 2px solid #eee;
      background: #fff;
      cursor: pointer;
      text-align: center;
    }
    .log-ex-card:active { border-color: #d0021b; }
    .log-ex-card.selected {
      border-color: #d0021b;
      background: #fff5f5;
    }
    .log-ex-card img,
    .log-ex-card .card-placeholder {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border: 1px solid #ddd;
      flex-shrink: 0;
    }
    .log-ex-card .card-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: #f2f2f2;
      color: #aaa;
    }
    .log-ex-card .card-name {
      font-size: 11px;
      color: #333;
      line-height: 1.3;
      word-break: break-word;
    }
    .log-ex-card.selected .card-name { color: #d0021b; font-weight: bold; }

    /* ── STORICO ── */
    #history-exercise-select {
      width: 100%;
      border: 1px solid #ccc;
      padding: 12px 10px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      background: #fff;
      outline: none;
    }
    #history-exercise-select:focus { border-color: #d0021b; }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .history-table thead tr { background: #1c1c1c; color: #fff; }
    .history-table th { text-align: left; padding: 10px; font-weight: normal; }
    .history-table td { padding: 10px; border-bottom: 1px solid #eee; }
    .history-table tr:nth-child(even) td { background: #f9f9f9; }
    .history-table .del-row {
      background: none;
      border: 1px solid #d0021b;
      color: #d0021b;
      cursor: pointer;
      padding: 4px 10px;
      font-size: 12px;
      min-height: 32px;
    }
    .history-table .del-row:active { background: #d0021b; color: #fff; }

    .empty-msg {
      color: #888;
      font-size: 14px;
      text-align: center;
      padding: 28px 0;
    }

    /* ── BADGE ULTIMO SET ── */
    #last-set-badge {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-left: 4px solid #1a7f37;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      margin-bottom: 14px;
      display: none;
    }
    #last-set-badge strong { color: #1a7f37; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; }
    ::-webkit-scrollbar-thumb:hover { background: #d0021b; }
  </style>
</head>
<body>

<header>
  <div class="logo">G</div>
  <h1>GYM TRACKER</h1>
</header>

<div class="tabs">
  <button class="active" onclick="switchTab('tab-exercises', this)">Esercizi</button>
  <button onclick="switchTab('tab-log', this)">Registra</button>
  <button onclick="switchTab('tab-history', this)">Storico</button>
</div>

<!-- ══ TAB 1: ESERCIZI ══ -->
<div class="page active" id="tab-exercises">
  <div class="card">
    <h2>Aggiungi esercizio</h2>
    <div class="add-form-grid">
      <div class="row">
        <input type="text" id="new-exercise" placeholder="Es. Panca piana…" maxlength="60"
               inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" />
      </div>
      <!-- area upload immagine -->
      <label class="img-upload-btn" for="file-input">
        <img class="preview" id="add-preview" src="" alt="anteprima" />
        <span id="add-upload-label">📷 Aggiungi immagine (opzionale)</span>
      </label>
      <input type="file" id="file-input" accept="image/*" />
      <button class="btn-add" id="btn-add-exercise">+ Aggiungi esercizio</button>
    </div>
  </div>

  <div class="card">
    <h2>I tuoi esercizi</h2>
    <ul id="exercise-list"></ul>
    <div class="empty-msg" id="no-exercises">Nessun esercizio. Aggiungine uno!</div>
  </div>
</div>

<!-- ══ TAB 2: REGISTRA SET ══ -->
<div class="page" id="tab-log">
  <div class="card">
    <h2>Seleziona esercizio</h2>
    <div id="log-exercise-grid"></div>
  </div>

  <div id="log-panel" style="display:none">
    <div id="log-exercise-name"></div>
    <div id="last-set-badge"></div>

    <div class="card">
      <h2>Set</h2>
      <div class="log-inputs">
        <div>
          <label for="inp-reps">Ripetizioni *</label>
          <input type="number" id="inp-reps" min="1" max="999"
                 inputmode="numeric" pattern="[0-9]*" placeholder="0" />
        </div>
        <div>
          <label for="inp-weight">Peso kg</label>
          <input type="number" id="inp-weight" min="0" max="9999" step="0.5"
                 inputmode="decimal" placeholder="—" />
        </div>
      </div>
      <div class="quick-reps">
        <button onclick="setReps(6)">6</button>
        <button onclick="setReps(8)">8</button>
        <button onclick="setReps(10)">10</button>
        <button onclick="setReps(12)">12</button>
        <button onclick="setReps(15)">15</button>
        <button onclick="setReps(20)">20</button>
      </div>
      <button class="btn-primary" id="btn-log-set">💾 Salva set</button>
    </div>
  </div>

  <div class="empty-msg" id="no-log-exercises" style="display:none">
    Nessun esercizio. Vai nella scheda "Esercizi" e aggiungine uno.
  </div>
</div>

<!-- ══ TAB 3: STORICO ══ -->
<div class="page" id="tab-history">
  <div class="card">
    <h2>Esercizio</h2>
    <select id="history-exercise-select">
      <option value="">— scegli —</option>
    </select>
  </div>
  <div class="card" id="history-card">
    <h2>Log</h2>
    <div id="history-content">
      <div class="empty-msg">Seleziona un esercizio per vedere lo storico.</div>
    </div>
  </div>
</div>

<!-- ══ MODAL MODIFICA ICONA ══ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Modifica icona</h3>
    <div id="modal-img-container"></div>
    <label class="modal-upload-btn" for="modal-file-input">📷 Scegli nuova immagine</label>
    <input type="file" id="modal-file-input" accept="image/*" />
    <button class="modal-remove-btn" id="modal-remove-btn">Rimuovi immagine</button>
    <div class="modal-actions">
      <button class="modal-btn-cancel" id="modal-cancel">Annulla</button>
      <button class="modal-btn-save"   id="modal-save">Salva</button>
    </div>
  </div>
</div>

<script>
  // ── storage ──
  const KEY = 'gymtracker_v1';
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || { exercises: [], logs: [] }; }
    catch { return { exercises: [], logs: [] }; }
  }
  function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
  let db = load();

  // ── uid ──
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ── formati data/ora ──
  function fmtDate(ts) {
    return new Date(ts).toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'2-digit' });
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
  }

  // ── ridimensiona immagine a 80x80 via canvas e restituisce base64 ──
  function resizeImage(file, size, callback) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        // ritaglia al centro (cover)
        const ratio  = Math.max(size / img.width, size / img.height);
        const w = img.width  * ratio;
        const h = img.height * ratio;
        const x = (size - w) / 2;
        const y = (size - h) / 2;
        ctx.drawImage(img, x, y, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── cambio tab ──
  function switchTab(tabId, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
    if (tabId === 'tab-log')     refreshLogSelect();
    if (tabId === 'tab-history') refreshHistorySelect();
  }

  // ══════════════════════════════════════
  // TAB ESERCIZI
  // ══════════════════════════════════════

  const exerciseList  = document.getElementById('exercise-list');
  const noExercises   = document.getElementById('no-exercises');
  const newExInput    = document.getElementById('new-exercise');
  const btnAddEx      = document.getElementById('btn-add-exercise');
  const fileInput     = document.getElementById('file-input');
  const addPreview    = document.getElementById('add-preview');
  const addUploadLbl  = document.getElementById('add-upload-label');

  // immagine pendente per il nuovo esercizio
  let pendingImage = null;

  // anteprima immagine nel form aggiungi
  fileInput.addEventListener('change', () => {
    if (!fileInput.files[0]) return;
    resizeImage(fileInput.files[0], 80, b64 => {
      pendingImage = b64;
      addPreview.src = b64;
      addPreview.classList.add('visible');
      addUploadLbl.textContent = '✓ Immagine pronta — tocca per cambiare';
    });
  });

  // costruisce l'icona per la lista (img o placeholder)
  function makeIcon(ex, size) {
    if (ex.image) {
      const img = document.createElement('img');
      img.src       = ex.image;
      img.alt       = ex.name;
      img.className = 'ex-icon';
      img.style.width  = size + 'px';
      img.style.height = size + 'px';
      return img;
    } else {
      const div = document.createElement('div');
      div.className = 'ex-icon-placeholder';
      div.style.width  = size + 'px';
      div.style.height = size + 'px';
      div.textContent = '🏋️';
      return div;
    }
  }

  function renderExercises() {
    exerciseList.innerHTML = '';
    noExercises.style.display = db.exercises.length === 0 ? 'block' : 'none';

    db.exercises.forEach(ex => {
      const li = document.createElement('li');

      // icona 44x44
      li.appendChild(makeIcon(ex, 44));

      // nome
      const span = document.createElement('span');
      span.className   = 'ex-name';
      span.textContent = ex.name;

      // pulsanti
      const actions = document.createElement('div');
      actions.className = 'ex-actions';

      const editBtn = document.createElement('button');
      editBtn.className   = 'btn-edit';
      editBtn.textContent = '🖼';
      editBtn.title       = 'Modifica icona';

      const delBtn = document.createElement('button');
      delBtn.className   = 'btn-del';
      delBtn.textContent = 'Elimina';

      // modifica icona → apre modal
      editBtn.addEventListener('click', e => {
        e.stopPropagation();
        openModal(ex.id);
      });

      // elimina esercizio
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm(`Eliminare "${ex.name}" e tutto il suo storico?`)) return;
        db.exercises = db.exercises.filter(x => x.id !== ex.id);
        db.logs      = db.logs.filter(l => l.exerciseId !== ex.id);
        save(db);
        renderExercises();
      });

      // tap riga → vai a registra
      li.addEventListener('click', e => {
        if (e.target === editBtn || e.target === delBtn) return;
        const tabBtn = document.querySelectorAll('.tabs button')[1];
        switchTab('tab-log', tabBtn);
        // seleziona automaticamente la card nella griglia
        selectLogExercise(ex.id);
      });

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      li.appendChild(span);
      li.appendChild(actions);
      exerciseList.appendChild(li);
    });
  }

  function addExercise() {
    const name = newExInput.value.trim();
    if (!name) return;
    if (db.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) {
      alert('Esercizio già presente.');
      return;
    }
    db.exercises.push({ id: uid(), name, image: pendingImage });
    save(db);
    // reset form
    newExInput.value = '';
    pendingImage     = null;
    fileInput.value  = '';
    addPreview.src   = '';
    addPreview.classList.remove('visible');
    addUploadLbl.textContent = '📷 Aggiungi immagine (opzionale)';
    renderExercises();
  }

  btnAddEx.addEventListener('click', addExercise);
  newExInput.addEventListener('keydown', e => { if (e.key === 'Enter') addExercise(); });

  // ══════════════════════════════════════
  // MODAL MODIFICA ICONA
  // ══════════════════════════════════════

  const modalOverlay  = document.getElementById('modal-overlay');
  const modalTitle    = document.getElementById('modal-title');
  const modalImgCont  = document.getElementById('modal-img-container');
  const modalFileInp  = document.getElementById('modal-file-input');
  const modalRemove   = document.getElementById('modal-remove-btn');
  const modalCancel   = document.getElementById('modal-cancel');
  const modalSave     = document.getElementById('modal-save');

  let editingId    = null; // id esercizio in modifica
  let modalImage   = null; // immagine corrente nel modal (null = rimossa)

  function openModal(exId) {
    const ex      = db.exercises.find(e => e.id === exId);
    editingId     = exId;
    modalImage    = ex.image || null;
    modalTitle.textContent = `Icona: ${ex.name}`;
    renderModalPreview();
    modalOverlay.classList.add('open');
  }

  function renderModalPreview() {
    modalImgCont.innerHTML = '';
    if (modalImage) {
      const img = document.createElement('img');
      img.src       = modalImage;
      img.className = 'modal-img-preview';
      modalImgCont.appendChild(img);
    } else {
      const div = document.createElement('div');
      div.className   = 'modal-img-placeholder';
      div.textContent = '🏋️';
      modalImgCont.appendChild(div);
    }
  }

  // carica nuova immagine nel modal
  modalFileInp.addEventListener('change', () => {
    if (!modalFileInp.files[0]) return;
    resizeImage(modalFileInp.files[0], 80, b64 => {
      modalImage = b64;
      renderModalPreview();
    });
  });

  modalRemove.addEventListener('click', () => {
    modalImage = null;
    renderModalPreview();
  });

  modalCancel.addEventListener('click', () => {
    modalOverlay.classList.remove('open');
    modalFileInp.value = '';
  });

  modalSave.addEventListener('click', () => {
    const ex = db.exercises.find(e => e.id === editingId);
    if (ex) {
      ex.image = modalImage;
      save(db);
      renderExercises();
      // aggiorna il pannello log se quell'esercizio è selezionato
      if (selectedLogId === editingId) showLogPanel(editingId);
    }
    modalOverlay.classList.remove('open');
    modalFileInp.value = '';
  });

  // chiudi modal toccando fuori
  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) {
      modalOverlay.classList.remove('open');
      modalFileInp.value = '';
    }
  });

  // ══════════════════════════════════════
  // TAB LOG
  // ══════════════════════════════════════

  const logGrid    = document.getElementById('log-exercise-grid');
  const logPanel   = document.getElementById('log-panel');
  const logExName  = document.getElementById('log-exercise-name');
  const lastBadge  = document.getElementById('last-set-badge');
  const inpReps    = document.getElementById('inp-reps');
  const inpWeight  = document.getElementById('inp-weight');
  const btnLogSet  = document.getElementById('btn-log-set');
  const noLogEx    = document.getElementById('no-log-exercises');

  // id esercizio attualmente selezionato nella griglia
  let selectedLogId = null;

  function setReps(n) { inpReps.value = n; inpWeight.focus(); }

  // costruisce la griglia di card esercizi
  function refreshLogGrid() {
    logGrid.innerHTML = '';
    selectedLogId = null;
    logPanel.style.display = 'none';

    if (db.exercises.length === 0) {
      noLogEx.style.display = 'block';
      logGrid.parentElement.style.display = 'none';
      return;
    }
    noLogEx.style.display = 'none';
    logGrid.parentElement.style.display = 'block';

    db.exercises.forEach(ex => {
      const card = document.createElement('div');
      card.className    = 'log-ex-card';
      card.dataset.exId = ex.id;

      // icona
      if (ex.image) {
        const img = document.createElement('img');
        img.src = ex.image;
        img.alt = ex.name;
        card.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className   = 'card-placeholder';
        ph.textContent = '🏋️';
        card.appendChild(ph);
      }

      // nome
      const nameEl = document.createElement('span');
      nameEl.className   = 'card-name';
      nameEl.textContent = ex.name;
      card.appendChild(nameEl);

      card.addEventListener('click', () => selectLogExercise(ex.id));
      logGrid.appendChild(card);
    });
  }

  function selectLogExercise(id) {
    selectedLogId = id;
    // evidenzia card selezionata
    logGrid.querySelectorAll('.log-ex-card').forEach(c => {
      c.classList.toggle('selected', c.dataset.exId === id);
    });
    showLogPanel(id);
  }

  function refreshLogSelect() { refreshLogGrid(); }
  function showLogPanel(id) {
    const ex = db.exercises.find(e => e.id === id);
    if (!ex) { logPanel.style.display = 'none'; return; }

    logPanel.style.display = 'block';

    // titolo con icona se presente
    logExName.innerHTML = '';
    if (ex.image) {
      const img = document.createElement('img');
      img.src    = ex.image;
      img.alt    = ex.name;
      img.width  = 40;
      img.height = 40;
      img.style.objectFit = 'cover';
      img.style.border    = '1px solid #ddd';
      logExName.appendChild(img);
    }
    const nameSpan = document.createElement('span');
    nameSpan.textContent = ex.name;
    logExName.appendChild(nameSpan);

    // badge ultimo set
    const lastLog = db.logs
      .filter(l => l.exerciseId === id)
      .sort((a, b) => b.ts - a.ts)[0];
    if (lastLog) {
      const wStr = lastLog.weight !== null ? ` · ${lastLog.weight} kg` : '';
      lastBadge.innerHTML = `Ultimo: <strong>${lastLog.reps} reps${wStr}</strong> — ${fmtDate(lastLog.ts)} ${fmtTime(lastLog.ts)}`;
      lastBadge.style.display = 'block';
    } else {
      lastBadge.style.display = 'none';
    }

    inpReps.value   = '';
    inpWeight.value = '';
  }

  btnLogSet.addEventListener('click', () => {
    const exId = selectedLogId;
    if (!exId) return;
    const reps = parseInt(inpReps.value, 10);
    if (!reps || reps < 1) {
      inpReps.style.borderColor = '#d0021b';
      inpReps.style.borderWidth = '2px';
      inpReps.focus();
      setTimeout(() => { inpReps.style.borderColor = ''; inpReps.style.borderWidth = ''; }, 1500);
      return;
    }
    const weightVal = inpWeight.value.trim();
    const weight    = weightVal !== '' ? parseFloat(weightVal) : null;
    db.logs.push({ id: uid(), exerciseId: exId, reps, weight, ts: Date.now() });
    save(db);

    btnLogSet.textContent       = '✓ Salvato!';
    btnLogSet.style.background  = '#1a7f37';
    setTimeout(() => {
      btnLogSet.textContent      = '💾 Salva set';
      btnLogSet.style.background = '';
    }, 1200);

    inpReps.value   = '';
    inpWeight.value = '';
    showLogPanel(exId);
  });

  // ══════════════════════════════════════
  // TAB STORICO
  // ══════════════════════════════════════

  const historySelect  = document.getElementById('history-exercise-select');
  const historyContent = document.getElementById('history-content');

  function refreshHistorySelect() {
    const prev = historySelect.value;
    historySelect.innerHTML = '<option value="">— scegli —</option>';
    db.exercises.forEach(ex => {
      const opt = document.createElement('option');
      opt.value       = ex.id;
      opt.textContent = ex.name;
      historySelect.appendChild(opt);
    });
    if (prev && db.exercises.find(e => e.id === prev)) {
      historySelect.value = prev;
      renderHistory(prev);
    } else {
      historyContent.innerHTML = '<div class="empty-msg">Seleziona un esercizio per vedere lo storico.</div>';
    }
  }

  function renderHistory(id) {
    const logs = db.logs.filter(l => l.exerciseId === id).sort((a, b) => b.ts - a.ts);
    if (logs.length === 0) {
      historyContent.innerHTML = '<div class="empty-msg">Nessun set registrato per questo esercizio.</div>';
      return;
    }
    const table = document.createElement('table');
    table.className = 'history-table';
    table.innerHTML = `
      <thead><tr>
        <th>Data</th><th>Ora</th><th>Reps</th><th>Kg</th><th></th>
      </tr></thead>
      <tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    logs.forEach(log => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fmtDate(log.ts)}</td>
        <td>${fmtTime(log.ts)}</td>
        <td><strong>${log.reps}</strong></td>
        <td>${log.weight !== null ? log.weight : '—'}</td>
        <td><button class="del-row" data-id="${log.id}">✕</button></td>`;
      tbody.appendChild(tr);
    });
    historyContent.innerHTML = '';
    historyContent.appendChild(table);
    historyContent.querySelectorAll('.del-row').forEach(btn => {
      btn.addEventListener('click', () => {
        db.logs = db.logs.filter(l => l.id !== btn.dataset.id);
        save(db);
        renderHistory(id);
      });
    });
  }

  historySelect.addEventListener('change', () => {
    if (historySelect.value) renderHistory(historySelect.value);
    else historyContent.innerHTML = '<div class="empty-msg">Seleziona un esercizio per vedere lo storico.</div>';
  });

  // ── avvio ──
  renderExercises();
  refreshLogSelect();
</script>
</body>
</html>
